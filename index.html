<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끝말잇기 — 둘이서 하는 한글 단어 게임 (무료)</title>
<meta name="description" content="친구랑 둘이서 번갈아 하는 끝말잇기! 폰 하나로 바로. 제한시간·중복 체크. 무료, 설치 없이 브라우저에서.">
<link rel="canonical" href="https://seam0814.github.io/wordplay/">
<style>
  :root{--bg:#f4f7ff;--card:#fff;--fg:#232436;--muted:#7b7f98;--border:#e4e8f5;--accent:#4a6bff;--accent2:#8a5cff}
  :root{--ok:#1aa86a;--bad:#e5484d}
  @media(prefers-color-scheme:dark){:root{--bg:#14161f;--card:#1c1f2b;--fg:#eef0f7;--muted:#9aa0bd;--border:#2a2e3e}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;line-height:1.6}
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 60px;text-align:center}
  h1{font-size:1.6rem;margin:.2em 0}
  p.sub{color:var(--muted);margin:.2em 0 1.2em}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 18px 44px -28px rgba(74,107,255,.5)}
  .turn{font-size:1.2rem;font-weight:800;margin-bottom:4px}
  .timer{font-size:3rem;font-weight:800;color:var(--accent);line-height:1}
  .timer.warn{color:var(--bad)}
  .need{margin:14px 0 6px;color:var(--muted)}
  .need b{font-size:2.2rem;color:var(--accent2);display:block;margin-top:4px}
  input{width:100%;padding:16px;font-size:1.4rem;text-align:center;border:2px solid var(--border);border-radius:14px;background:var(--bg);color:var(--fg);margin-top:8px}
  input:focus{outline:none;border-color:var(--accent)}
  .btn{display:block;width:100%;padding:15px;margin-top:12px;border:none;border-radius:14px;font-size:1.1rem;font-weight:700;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent2));cursor:pointer}
  .btn.sec{background:transparent;color:var(--accent);border:2px solid var(--border)}
  .msg{min-height:20px;margin-top:10px;font-weight:600}
  .msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
  .chain{margin-top:16px;max-height:120px;overflow:auto;font-size:.9rem;color:var(--muted);text-align:left;background:var(--bg);border-radius:10px;padding:8px 12px}
  .setup .row{display:flex;gap:10px}.setup input{font-size:1rem;text-align:left}
  .field{flex:1;text-align:left}label{font-size:.82rem;color:var(--muted)}
  .big{font-size:2rem;margin:.2em 0}
  .hint{color:var(--muted);font-size:.8rem;margin-top:16px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>끝말잇기 🗣️</h1>
  <p class="sub">폰 하나 놓고 둘이 번갈아! 제한시간 안에 단어를 이어보세요.</p>

  <div class="card setup" id="setup">
    <div class="row">
      <div class="field"><label>플레이어 1</label><input id="p1" value="플레이어 1" maxlength="8"></div>
      <div class="field"><label>플레이어 2</label><input id="p2" value="플레이어 2" maxlength="8"></div>
    </div>
    <div class="field" style="margin-top:10px"><label>제한시간(초)</label><input id="sec" type="number" value="10" min="3" max="60"></div>
    <button class="btn" id="start">게임 시작</button>
    <p class="hint">규칙: 앞 단어의 <b>끝 글자</b>로 시작하는 2글자 이상 단어 입력 · 이미 쓴 단어 불가 · 시간 초과 시 패배. (진짜 단어인지는 서로 판단!)</p>
  </div>

  <div class="card hide" id="game">
    <div class="turn" id="turn">플레이어 1 차례</div>
    <div class="timer" id="timer">10</div>
    <div class="need">이 글자로 시작<b id="need">?</b></div>
    <input id="word" autocomplete="off" autocapitalize="off" placeholder="단어 입력">
    <button class="btn" id="submit">입력!</button>
    <div class="msg" id="msg"></div>
    <div class="chain" id="chain"></div>
  </div>

  <div class="card hide" id="over">
    <div class="big" id="winner">🎉</div>
    <p id="reason" class="sub"></p>
    <button class="btn" id="again">다시 하기</button>
    <button class="btn sec" id="home">처음으로</button>
  </div>
  <p class="hint">둘이 각자 폰으로 하고 싶으면? 온라인 '방' 기능이 필요해요(추후). 지금은 폰 하나로 번갈아 즐겨요!</p>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var names=["",""],limit=10,turn=0,need="",used={},timer=null,left=10,chain=[];
  var lastCh=function(w){return w[w.length-1]};
  function show(id){["setup","game","over"].forEach(function(x){$("#"+x).classList.toggle("hide",x!==id)})}
  $("#start").addEventListener("click",function(){
    names=[$("#p1").value.trim()||"플레이어 1",$("#p2").value.trim()||"플레이어 2"];
    limit=Math.max(3,parseInt($("#sec").value)||10);
    turn=0;need="";used={};chain=[];$("#chain").innerHTML="";$("#msg").textContent="";
    $("#need").textContent="아무 단어";show("game");newTurn(true);$("#word").focus();
  });
  function newTurn(first){
    $("#turn").textContent=names[turn]+" 차례";
    $("#need").textContent=first?"아무 단어":need;
    $("#word").value="";$("#word").focus();
    left=limit;$("#timer").textContent=left;$("#timer").classList.remove("warn");
    clearInterval(timer);timer=setInterval(tick,1000);
  }
  function tick(){left--;$("#timer").textContent=left;if(left<=3)$("#timer").classList.add("warn");
    if(left<=0){clearInterval(timer);end(names[1-turn],names[turn]+"님 시간 초과! ⏰")}}
  function msg(t,ok){var m=$("#msg");m.textContent=t;m.className="msg "+(ok?"ok":"bad")}
  function submit(){
    var w=$("#word").value.trim();
    if(w.length<2){msg("2글자 이상 입력!");return}
    if(need && w[0]!==need){msg("'"+need+"' (으)로 시작해야 해요!");return}
    if(used[w]){msg("이미 나온 단어예요!");return}
    // 통과
    used[w]=1;chain.push(w);
    $("#chain").innerHTML=chain.map(function(x,i){return (i+1)+". "+x}).reverse().join("<br>");
    need=lastCh(w);turn=1-turn;clearInterval(timer);msg("좋아요!",true);newTurn(false);
  }
  $("#submit").addEventListener("click",submit);
  $("#word").addEventListener("keydown",function(e){if(e.key==="Enter")submit()});
  function end(winner,reason){clearInterval(timer);$("#winner").textContent="🎉 "+winner+" 승리!";$("#reason").textContent=reason+" 이어진 단어 "+chain.length+"개.";show("over")}
  $("#again").addEventListener("click",function(){$("#start").click()});
  $("#home").addEventListener("click",function(){show("setup")});
})();
</script>
</body>
</html>
